<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <title data-i18n="title.host">Host — MTG Treachery</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* The host screen is meant to be read from across a table, so the QR is
       larger than the small lobby one. */
    .host-qr img { width: min(70vmin, 360px); height: min(70vmin, 360px); }
    .host-hint { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand-title">
        <img class="brand-logo" src="/assets/logo.png" alt="" width="40" height="40" />
        <h1>MTG Treachery</h1>
      </div>
      <div class="sub" data-i18n="host.sub">Scan to join from your phone</div>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="card stack">
      <div class="qr-wrap host-qr">
        <img id="qr" data-i18n-alt="host.qrAlt" alt="QR to open the game" />
        <div class="lanurl" id="lanurl">Starting…</div>
      </div>
      <div class="footer-note center host-hint" data-i18n="host.hint">
        This computer only hosts the game. Everyone plays from their phone —
        scan the code or open the address above.
      </div>
    </div>

    <div class="version-footer" id="app-version"></div>
  </div>

  <script type="module" src="/version.js"></script>
  <script type="module" src="/rules.js"></script>
  <script type="module" src="/gallery.js"></script>

  <script type="module">
    import { t } from '/i18n.js';
    const lanurl = document.getElementById('lanurl');
    lanurl.textContent = t('host.starting');
    // Fetch the QR + URL for the LAN home page and render them big.
    fetch('/api/host-qr')
      .then((r) => r.json())
      .then((d) => {
        if (d.dataUrl) document.getElementById('qr').src = d.dataUrl;
        lanurl.textContent = d.joinUrl || '';
      })
      .catch(() => {
        lanurl.textContent = t('host.noLan');
      });
  </script>
</body>
</html>
