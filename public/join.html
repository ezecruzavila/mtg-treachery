<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <title data-i18n="title.join">Join — MTG Treachery</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand-title">
        <img class="brand-logo" src="/assets/logo.png" alt="" width="40" height="40" />
        <h1>MTG Treachery</h1>
      </div>
      <div class="sub" data-i18n="join.sub">Join the room</div>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="card stack">
      <div>
        <label for="code" data-i18n="code.label">Room code</label>
        <input id="code" type="text" class="code-input" placeholder="ABCD" autocomplete="off" maxlength="4" />
      </div>
      <div>
        <label for="name" data-i18n="name.label">Your name</label>
        <input id="name" type="text" data-i18n-placeholder="name.placeholderJoin" placeholder="e.g. Bob" autocomplete="off" maxlength="12" />
      </div>
      <button id="join-btn" data-i18n="join">Join</button>
    </div>

    <div class="footer-note" data-i18n="join.footer">
      Were you already in this room? You'll be reconnected automatically.
    </div>

    <div class="version-footer" id="app-version"></div>
  </div>

  <script type="module" src="/version.js"></script>
  <script type="module" src="/rules.js"></script>
  <script type="module">
    import { joinExisting, showError, getName, setName, hasSession, clearSession, withSlot } from '/app.js';
    import { t } from '/i18n.js';

    const params = new URLSearchParams(location.search);
    const preCode = (params.get('code') || '').toUpperCase();
    const codeEl = document.getElementById('code');
    const nameEl = document.getElementById('name');
    codeEl.value = preCode;
    nameEl.value = getName();

    // If we already have a saved session for this room, go straight in.
    if (preCode && hasSession(preCode)) {
      fetch(`/api/rooms/${preCode}`).then((r) => {
        if (r.ok) location.replace(withSlot(`/room/${preCode}`));
        else { clearSession(preCode); location.replace(withSlot('/home')); }
      }).catch(() => location.replace(withSlot('/home')));
    }

    document.getElementById('join-btn').addEventListener('click', async () => {
      const code = codeEl.value.trim().toUpperCase();
      const name = nameEl.value.trim();
      if (code.length !== 4) return showError(t('error.codeLength'));
      if (!name) return showError(t('error.needNameJoin'));
      setName(name);
      await joinExisting(code, name);
    });

    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('join-btn').click(); });
  </script>
</body>
</html>
