<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <title>Join — MTG Treachery</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <h1>MTG Treachery</h1>
      <div class="sub">Join the room</div>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="card stack">
      <div>
        <label for="code">Room code</label>
        <input id="code" type="text" class="code-input" placeholder="ABCD" autocomplete="off" maxlength="4" />
      </div>
      <div>
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="e.g. Bob" autocomplete="off" maxlength="12" />
      </div>
      <button id="join-btn">Join</button>
    </div>

    <div class="footer-note">
      Were you already in this room? You'll be reconnected automatically.
    </div>
  </div>

  <script type="module" src="/rules.js"></script>
  <script type="module">
    import { joinExisting, showError, getName, setName, hasSession, clearSession } from '/app.js';

    const params = new URLSearchParams(location.search);
    const preCode = (params.get('code') || '').toUpperCase();
    const codeEl = document.getElementById('code');
    const nameEl = document.getElementById('name');
    codeEl.value = preCode;
    nameEl.value = getName();

    // If we already have a saved session for this room, go straight in.
    if (preCode && hasSession(preCode)) {
      fetch(`/api/rooms/${preCode}`).then((r) => {
        if (r.ok) location.replace(`/room/${preCode}`);
        else { clearSession(preCode); location.replace('/home'); }
      }).catch(() => location.replace('/home'));
    }

    document.getElementById('join-btn').addEventListener('click', async () => {
      const code = codeEl.value.trim().toUpperCase();
      const name = nameEl.value.trim();
      if (code.length !== 4) return showError('The code has 4 letters.');
      if (!name) return showError('Enter your name.');
      setName(name);
      await joinExisting(code, name);
    });

    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('join-btn').click(); });
  </script>
</body>
</html>
