<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1216" />
  <title>Lab — MTG Treachery</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body {
      height: 100%;
    }
    body.lab {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 100dvh;
    }
    .lab-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .lab-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-right: 8px;
    }
    .lab-brand img {
      width: 28px;
      height: 28px;
      display: block;
    }
    .lab-brand span { color: var(--accent-hi); }
    .lab-bar .segmented { width: auto; }
    .lab-bar .segmented button { padding: 8px 10px; font-size: 0.82rem; }
    .lab-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    .lab-actions button {
      width: auto;
      padding: 10px 16px;
      font-size: 0.92rem;
    }
    .lab-status {
      width: 100%;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .lab-status.error-text { color: #f0a99f; }
    .phones {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      padding: 16px;
      align-content: start;
    }
    .phone {
      background: #0a0d11;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .phone-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 8px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .phone-bar .slot {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.75rem;
    }
    .phone-bar .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phone-bar button {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .phone-bar button:hover { color: var(--text); background: var(--panel); }
    .phone-screen {
      position: relative;
      width: 100%;
      background: var(--bg);
      overflow: hidden;
    }
    .phone-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 780px;
      border: 0;
      transform-origin: 0 0;
      background: var(--bg);
    }
  </style>
</head>
<body class="lab">
  <div class="lab-bar">
    <div class="lab-brand">
      <img src="/assets/logo.png" alt="" width="28" height="28" />
      MTG Treachery <span>lab</span>
    </div>

    <div class="segmented" id="count" title="How many phones">
      <button type="button" data-n="4" class="active">4</button>
      <button type="button" data-n="5">5</button>
      <button type="button" data-n="6">6</button>
      <button type="button" data-n="7">7</button>
      <button type="button" data-n="8">8</button>
    </div>

    <div class="segmented" id="rarity" title="Card rarity">
      <button type="button" data-rarity="U" class="active">Uncommon</button>
      <button type="button" data-rarity="R">Rare</button>
      <button type="button" data-rarity="M">Mythic</button>
    </div>

    <div class="lab-actions">
      <button type="button" id="blank-btn" class="secondary">Blank phones</button>
      <button type="button" id="fill-btn">Start table</button>
      <button type="button" id="reset-btn" class="secondary">Reset</button>
    </div>

    <div class="lab-status" id="status">Each frame is a separate player. Start a table, or open blank phones and play through create / join yourself.</div>
  </div>

  <div class="phones" id="phones"></div>

  <script type="module" src="/lab.js"></script>
</body>
</html>
