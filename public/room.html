<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1216" />
  <title data-i18n="title.room">Room — MTG Treachery</title>
  <link rel="icon" href="/favicon.ico" type="image/png" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand-title">
        <img class="brand-logo" src="/assets/logo.png" alt="" width="40" height="40" />
        <h1>MTG Treachery</h1>
      </div>
      <div class="sub" id="conn-sub"></div>
    </div>

    <div id="error" class="error hidden"></div>

    <!-- ===================== LOBBY VIEW ===================== -->
    <section id="view-lobby" class="hidden stack">
      <div class="card">
        <div class="section-title center" data-i18n="room.roomCode">Room code</div>
        <div class="roomcode" id="roomcode">····</div>
        <div class="qr-wrap">
          <img id="qr" data-i18n-alt="room.qrAlt" alt="QR to join" />
          <div class="lanurl" id="lanurl"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">
          <span data-i18n="room.players">Players</span> <span class="count-pill" id="count">0</span>
        </div>
        <ul class="players" id="players"></ul>
      </div>

      <div id="deal-area" class="stack">
        <button id="deal-btn" disabled data-i18n="room.start">Start</button>
        <div class="role-help center" id="deal-help"></div>
      </div>

      <div id="wait-area" class="hidden card center muted">
        <span data-i18n="room.waitingBefore">Waiting for </span><b id="dealer-name">the room creator</b><span data-i18n="room.waitingAfter"> to deal…</span>
      </div>
    </section>

    <!-- ===================== MY ROLE VIEW ===================== -->
    <section id="view-role" class="hidden stack">
      <div class="role-stage">
        <div class="role-card no-anim" id="role-card">
          <div class="face back">
            <img id="card-back-img" data-i18n-alt="room.cardBackAlt" alt="Card back" />
          </div>
          <div class="face front">
            <img id="card-front-img" data-i18n-alt="room.cardAlt" alt="Your identity card" />
          </div>
        </div>
      </div>

      <div class="role-help center" id="role-help" data-i18n="room.flipHelp">Tap the card to flip it. It hides itself after 10 s.</div>

      <!-- Unveil: reversible switch (no modal) -->
      <div class="card switch-row" id="unveil-area">
        <div class="switch-text">
          <span class="switch-label" data-i18n="room.unveil">Unveil</span>
          <span class="switch-sub" data-i18n="room.unveilSub">Keeps your card face-up</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="unveil-toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="card">
        <div class="role-counts" id="role-counts"></div>
        <ul class="players" id="players-role"></ul>
      </div>

      <button id="defeat-btn" class="danger secondary" data-i18n="room.surrender">Surrender</button>

      <!-- Dealer-only controls -->
      <div id="dealer-controls" class="stack hidden">
        <button id="dealagain-btn" class="secondary" data-i18n="room.restart">Restart</button>
        <button id="close-btn" class="danger secondary" data-i18n="room.endGame">End Game</button>
      </div>
    </section>

    <div class="version-footer" id="app-version"></div>
  </div>

  <!-- Card viewer: shown when tapping an unveiled player's name -->
  <div id="card-modal" class="modal-backdrop hidden">
    <div class="card-viewer">
      <div class="card-viewer-name" id="card-modal-name"></div>
      <img id="card-modal-img" class="card-viewer-img" data-i18n-alt="room.cardAlt" alt="Identity card" />
      <div class="card-viewer-hint" data-i18n="room.tapClose">Tap anywhere to close</div>
    </div>
  </div>

  <!-- Confirmation modal (reused by Restart and End Game) -->
  <div id="confirm-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-text"></p>
      <div class="row">
        <button id="confirm-cancel" class="secondary" data-i18n="room.cancel">Cancel</button>
        <button id="confirm-ok" class="danger" data-i18n="room.confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="/version.js"></script>
  <script type="module" src="/rules.js"></script>
  <script type="module" src="/room.js"></script>
</body>
</html>
